<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogDiag Collector</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/app.js"></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-name">LogDiag Collector</div>
      <div class="brand-version" id="version">&nbsp;</div>
    </div>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <div class="side-foot">
      <div class="logdiag-card">
        <div class="copyright">© 2026 LogDiag</div>
        <a class="btn btn-primary btn-small btn-block" id="analyze" href="https://logdiag.com/" target="_blank" rel="noopener noreferrer">开始分析日志</a>
      </div>
      <div class="side-icons" id="side-icons"></div>
    </div>
  </aside>
  <main class="main" id="main">
    <div class="banner-stack" id="banners"></div>
    <div class="page" id="page"></div>
  </main>
  <footer class="status-bar">
    <span class="tag tag-gray" id="conn">连接中</span>
    <span class="status-text" id="status"></span>
    <a class="status-tasks" id="status-tasks" href="#/collect" hidden></a>
  </footer>
</div>
</body>
</html>
