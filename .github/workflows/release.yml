# 推送 v* 标签时发布：测试 → 编译 → SHA256SUMS → latest.json → 构建证明 → GitHub Release。
# 发布方式：先把 CHANGELOG.md 里的“未发布”改成版本号并合入 main，再 git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: 发布 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 创建 Release
      id-token: write     # 构建证明需要 OIDC 令牌
      attestations: write # 保存构建证明
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 测试
        run: go test -count=1 ./...

      - name: 编译
        run: scripts/build.sh "$GITHUB_REF_NAME" amd64

      - name: 生成 SHA256SUMS
        working-directory: dist
        run: sha256sum -- *.exe | tee SHA256SUMS

      # latest.json 供检查更新和网站下载页读取（格式见 docs/schema/latest-1.schema.json）。
      # 更新说明取自 CHANGELOG.md 里这个版本的一节，正式版没有这一节时发布失败。
      # 旧版本有必须升级的问题（例如安全问题）时，把 MIN_SUPPORTED 改成修复它的版本。
      - name: 生成 latest.json
        env:
          MIN_SUPPORTED: 0.1.0
        run: |
          go run ./scripts/latestjson -version "$GITHUB_REF_NAME" -min-supported "$MIN_SUPPORTED" dist/*.exe > dist/latest.json
          cat dist/latest.json

      # 构建证明（SLSA provenance）让任何人都能核对 exe 是由本仓库这次提交在 GitHub Actions 上编出来的。
      # README 承诺每个 Release 都有，所以生成失败（例如仓库又改回私有）时整个发布失败，不发没有证明的版本。
      - name: 构建证明
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.exe

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.exe dist/SHA256SUMS dist/latest.json \
            --verify-tag \
            --title "LogDiag Collector ${TAG#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            "${flags[@]}"
