# 每次推送和 PR：格式检查、vet、单元测试与回放测试（Linux + Windows），并编译可下载的 Windows exe。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 检查格式
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件需要 gofmt：$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 测试（含竞态检测）
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: 测试
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

      - name: 冒烟测试：exe 能在 Windows 上启动
        if: runner.os == 'Windows'
        shell: bash
        run: |
          exe=$(scripts/build.sh)
          "./$exe" version

  build:
    name: 编译 Windows exe
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 编译
        id: build
        run: echo "exe=$(scripts/build.sh)" >> "$GITHUB_OUTPUT"

      - name: SHA-256
        run: |
          {
            echo '```'
            sha256sum "${{ steps.build.outputs.exe }}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.build.outputs.exe }}
          archive: false
          if-no-files-found: error
          retention-days: 30
